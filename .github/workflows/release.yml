name: Package Fusion release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Vendor verified upstream engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\vendor-engine.ps1
      - name: Create add-in archive
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          $archive = Join-Path $env:RUNNER_TEMP "stl2step-fusion-$tag-windows-x64.zip"
          Compress-Archive -Path 'Stl2StepFusion','ENGINE_CONTRACT.md','LICENSE','LICENSE.stl2step','README.md','CHANGELOG.md','THIRD_PARTY_NOTICES.md','licenses','config' -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify add-in archive
        shell: pwsh
        run: python scripts/verify_release_archive.py $env:ARCHIVE --addon-dir Stl2StepFusion
      - name: Upload add-in archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          gh release upload $tag $env:ARCHIVE --repo $env:GITHUB_REPOSITORY --clobber
