name: Update bundled stl2step engine

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-engine:
    runs-on: windows-latest
    steps:
      - name: Check out Fusion add-in
        uses: actions/checkout@v4

      - name: Download latest upstream Windows engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/BlinkingSun/stl2step/releases/latest | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -match '^stl2step-engine-v.*-windows-x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No upstream Windows engine asset found in $($release.tag_name)" }

          $download = Join-Path $env:RUNNER_TEMP $asset.name
          gh release download $release.tag_name --repo BlinkingSun/stl2step --pattern $asset.name --dir $env:RUNNER_TEMP --clobber
          $extract = Join-Path $env:RUNNER_TEMP 'stl2step-engine'
          Expand-Archive -LiteralPath $download -DestinationPath $extract -Force

          $destination = Join-Path $env:GITHUB_WORKSPACE 'Stl2StepFusion\bin\windows-x86_64'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -LiteralPath $destination -File | Remove-Item -Force
          Get-ChildItem -LiteralPath $extract -File | Copy-Item -Destination $destination -Force

          $exe = Join-Path $destination 'stl2step.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Extracted release did not contain stl2step.exe" }
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^stl2step \d+\.\d+\.\d+$') {
            throw "Engine validation failed (exit $LASTEXITCODE): $version"
          }
          "UPSTREAM_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ENGINE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish update branch
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "The bundled engine is already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/update-engine
          git add Stl2StepFusion/bin/windows-x86_64
          git commit -m "Update bundled engine to $env:ENGINE_VERSION"
          git push --force origin automation/update-engine
