name: Update bundled stl2step engine

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-engine:
    runs-on: windows-latest
    steps:
      - name: Check out Fusion add-on
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check latest upstream engine manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/BlinkingSun/stl2step/releases/latest | ConvertFrom-Json
          $manifestAsset = $release.assets | Where-Object name -eq 'engine-manifest.json' | Select-Object -First 1
          if (-not $manifestAsset) { throw "No engine-manifest.json found in $($release.tag_name)" }
          gh release download $release.tag_name --repo BlinkingSun/stl2step --pattern 'engine-manifest.json' --dir $env:RUNNER_TEMP --clobber
          $manifest = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'engine-manifest.json') | ConvertFrom-Json
          $windows = $manifest.assets.'windows-x64'
          if (-not $windows) { throw "Manifest has no windows-x64 entry" }
          $config = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'config\engine-release.json') | ConvertFrom-Json
          if ($config.tag -eq $release.tag_name -and $config.sha256 -eq $windows.sha256) { exit 0 }
          @{ upstreamRepository='BlinkingSun/stl2step'; tag=$release.tag_name; engineVersion=$manifest.engineVersion; asset=$windows.name; sha256=$windows.sha256; size=$windows.size } |
            ConvertTo-Json | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'config\engine-release.json')
          "UPSTREAM_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ENGINE_VERSION=$($manifest.engineVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          commit-message: "Update bundled engine to ${{ env.ENGINE_VERSION }}"
          title: "Update bundled stl2step engine to ${{ env.ENGINE_VERSION }}"
          body: |
            Automated weekly check against the canonical upstream `BlinkingSun/stl2step` release.

            Upstream release: `${{ env.UPSTREAM_TAG }}`
            Validated executable: `${{ env.ENGINE_VERSION }}`
          branch: automation/update-engine
          delete-branch: true

      - name: Enable automatic merge
        if: steps.create-pr.outputs.pull-request-number != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} `
            --repo $env:GITHUB_REPOSITORY --auto --squash --delete-branch


